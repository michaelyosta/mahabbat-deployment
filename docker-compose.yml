name: mahabbat

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pull_policy: ${MAHABBAT_PULL_POLICY:-missing}
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull_policy: ${MAHABBAT_PULL_POLICY:-missing}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  server:
    build:
      context: .
      dockerfile: deploy/mahabbat-twenty.Dockerfile
    image: ${MAHABBAT_TWENTY_IMAGE:-ghcr.io/${MAHABBAT_IMAGE_OWNER:-local}/mahabbat-twenty:v2.29.0-venue}
    pull_policy: ${MAHABBAT_PULL_POLICY:-missing}
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      FRONT_AUTO_BASE_URL: ${FRONT_AUTO_BASE_URL:-true}
      MAHABBAT_INTERNAL_ROUTE_SECRET: ${MAHABBAT_INTERNAL_ROUTE_SECRET}
      MAHABBAT_REQUIRE_PERSONAL_INVITE_FOR_PASSWORD_SIGNUP: ${MAHABBAT_REQUIRE_PERSONAL_INVITE_FOR_PASSWORD_SIGNUP:-true}
      MAHABBAT_SSO_SIGNUP_INVITE_MODE: ${MAHABBAT_SSO_SIGNUP_INVITE_MODE:-}
      MAHABBAT_PIN_LOOKUP_SECRET: ${MAHABBAT_PIN_LOOKUP_SECRET:-${MAHABBAT_INTERNAL_ROUTE_SECRET}}
      MAHABBAT_ALLOW_INSECURE_PIN_LOOKUP: ${MAHABBAT_ALLOW_INSECURE_PIN_LOOKUP:-}
      MAHABBAT_IMAGE_DIGESTS_JSON: ${MAHABBAT_IMAGE_DIGESTS_JSON:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  worker:
    build:
      context: .
      dockerfile: deploy/mahabbat-twenty.Dockerfile
    image: ${MAHABBAT_TWENTY_IMAGE:-ghcr.io/${MAHABBAT_IMAGE_OWNER:-local}/mahabbat-twenty:v2.29.0-venue}
    pull_policy: ${MAHABBAT_PULL_POLICY:-missing}
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: http://server:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      FRONT_AUTO_BASE_URL: ${FRONT_AUTO_BASE_URL:-true}
      MAHABBAT_INTERNAL_ROUTE_SECRET: ${MAHABBAT_INTERNAL_ROUTE_SECRET}
      MAHABBAT_REQUIRE_PERSONAL_INVITE_FOR_PASSWORD_SIGNUP: ${MAHABBAT_REQUIRE_PERSONAL_INVITE_FOR_PASSWORD_SIGNUP:-true}
      MAHABBAT_SSO_SIGNUP_INVITE_MODE: ${MAHABBAT_SSO_SIGNUP_INVITE_MODE:-}
      MAHABBAT_PRINT_GATEWAY_URL: ${MAHABBAT_PRINT_GATEWAY_URL:-http://host.docker.internal:3110}
      MAHABBAT_PIN_LOOKUP_SECRET: ${MAHABBAT_PIN_LOOKUP_SECRET:-${MAHABBAT_INTERNAL_ROUTE_SECRET}}
      MAHABBAT_ALLOW_INSECURE_PIN_LOOKUP: ${MAHABBAT_ALLOW_INSECURE_PIN_LOOKUP:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      MAHABBAT_API_KEY: ${MAHABBAT_API_KEY:-}
      TWENTY_APP_ACCESS_TOKEN: ${TWENTY_APP_ACCESS_TOKEN:-}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q 'queue-worker'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always

  pos-gateway:
    build:
      context: ./mahabbat-app
      dockerfile: pos-standalone/Dockerfile
    image: ${MAHABBAT_POS_IMAGE:-ghcr.io/${MAHABBAT_IMAGE_OWNER:-local}/mahabbat-pos-gateway:v2.29.0-venue}
    pull_policy: ${MAHABBAT_PULL_POLICY:-missing}
    environment:
      NODE_ENV: production
      POS_GATEWAY_PORT: ${POS_GATEWAY_PORT:-3100}
      POS_CORS_ORIGIN: ${POS_CORS_ORIGIN:-}
      POS_GATEWAY_MAX_BODY_BYTES: ${POS_GATEWAY_MAX_BODY_BYTES:-32768}
      POS_GATEWAY_BUCKET_CAPACITY: ${POS_GATEWAY_BUCKET_CAPACITY:-30}
      POS_GATEWAY_BUCKET_WINDOW_MS: ${POS_GATEWAY_BUCKET_WINDOW_MS:-60000}
      MAHABBAT_INTERNAL_ROUTE_SECRET: ${MAHABBAT_INTERNAL_ROUTE_SECRET}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      TWENTY_API_URL: http://server:3000
    ports:
      - "127.0.0.1:3100:3100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  db-data:
  redis-data:
  server-local-data:
