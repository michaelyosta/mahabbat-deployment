name: mahabbat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  server:
    build:
      context: .
      dockerfile: deploy/mahabbat-branding.Dockerfile
    image: mahabbat-twenty:v2.29.0-branding
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      FRONT_AUTO_BASE_URL: ${FRONT_AUTO_BASE_URL:-true}
      MAHABBAT_INTERNAL_ROUTE_SECRET: ${MAHABBAT_INTERNAL_ROUTE_SECRET}
      TWENTY_APP_ACCESS_TOKEN: ${TWENTY_APP_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  worker:
    build:
      context: .
      dockerfile: deploy/mahabbat-branding.Dockerfile
    image: mahabbat-twenty:v2.29.0-branding
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: http://server:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      FRONT_AUTO_BASE_URL: ${FRONT_AUTO_BASE_URL:-true}
      MAHABBAT_INTERNAL_ROUTE_SECRET: ${MAHABBAT_INTERNAL_ROUTE_SECRET}
      TWENTY_APP_ACCESS_TOKEN: ${TWENTY_APP_ACCESS_TOKEN:-}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    restart: always

  pos-gateway:
    build:
      context: ./mahabbat-app
      dockerfile: pos-standalone/Dockerfile
    image: mahabbat-pos-gateway:local
    environment:
      NODE_ENV: production
      POS_GATEWAY_PORT: ${POS_GATEWAY_PORT:-3100}
      POS_CORS_ORIGIN: ${POS_CORS_ORIGIN:-*}
      TWENTY_API_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      MAHABBAT_API_KEY: ${MAHABBAT_API_KEY:-}
      TWENTY_APP_ACCESS_TOKEN: ${TWENTY_APP_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  db-data:
  redis-data:
  server-local-data:
